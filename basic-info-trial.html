<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/top-page.css">
  <title>基本情報 お試し</title>
  <meta name="description" content="基本情報セクションのお試しレイアウトです。">
  <style>
    figure {
      margin: 0;
    }

    .trial-page {
      padding: 32px 0 80px;
    }

    .trial-shell {
      width: min(1160px, calc(100% - 32px));
      margin: 0 auto;
      display: grid;
      gap: 20px;
    }

    .trial-header {
      display: grid;
      gap: 10px;
      justify-items: start;
    }

    .trial-header h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 2.9rem);
      line-height: 1.15;
      letter-spacing: 0.02em;
    }

    .basic-info-layout {
      display: grid;
      grid-template-columns: 0.95fr 0.86fr 0.86fr;
      gap: 10px;
      align-items: stretch;
    }

    .trial-card,
    .trial-visual,
    .trial-map,
    .trial-image-label {
      background: rgba(255, 255, 255, .86);
      border: 1px solid rgba(230, 221, 210, .92);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
    }

    .trial-visual {
      overflow: hidden;
      position: relative;
    }

    .trial-visual img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .trial-left {
      min-height: 344px;
    }

    .trial-middle,
    .trial-right {
      display: grid;
      gap: 10px;
      grid-template-rows: 1fr 1fr 1fr;
    }

    .trial-middle {
      grid-template-rows: auto auto auto;
      justify-items: stretch;
    }

    .trial-middle > * {
      width: 100%;
    }

    .trial-card {
      padding: 20px 18px;
      height: 100%;
      display: grid;
      align-content: center;
    }

    .trial-card h2 {
      margin: 0 0 14px;
      font-size: 1.08rem;
      line-height: 1.85;
      letter-spacing: 0.02em;
    }

    .trial-list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 8px;
    }

    .trial-list li {
      position: relative;
      padding-left: 16px;
      color: var(--text);
      font-size: 0.9rem;
      line-height: 1.7;
    }

    .trial-list li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0.78em;
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: rgba(186, 129, 85, .78);
      transform: translateY(-50%);
    }

    .trial-subvisual,
    .trial-price {
      min-height: 0;
      overflow: hidden;
    }

    .trial-subvisual {
      height: 168px;
    }

    .trial-subvisual img {
      object-position: center center;
    }

    .trial-price-wrap {
      display: grid;
      gap: 12px;
      align-content: start;
    }

    .trial-price-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .trial-price-actions .btn {
      min-width: 132px;
    }

    img.trial-price {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
      object-position: center;
      background: transparent;
      transform: none;
      border-radius: 0;
    }

    .trial-station {
      min-height: 0;
    }

    .trial-image-label {
      padding: 8px 14px;
      text-align: center;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text);
      box-shadow: none;
    }

    .trial-map {
      padding: 0;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 0;
      grid-row: span 2;
    }

    .trial-map-head {
      padding: 12px 14px 0;
      display: grid;
      gap: 4px;
    }

    .trial-map-head strong {
      font-size: 0.98rem;
      line-height: 1.5;
    }

    .trial-map-head p {
      margin: 0;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.6;
    }

    .trial-map iframe {
      width: 100%;
      height: 100%;
      min-height: 0;
      border: 0;
      display: block;
    }

    @media (max-width: 68.6875em) {
      .basic-info-layout {
        grid-template-columns: 1fr 1fr;
      }

      .trial-left {
        display: none;
      }

      .trial-right {
        grid-template-rows: auto auto;
      }

      .trial-middle {
        grid-template-rows: auto auto auto;
      }

      .trial-map {
        grid-row: auto;
      }
    }

    @media (max-width: 47.9375em) {
      .trial-page {
        padding-top: 20px;
      }

      .basic-info-layout {
        grid-template-columns: 1fr;
      }

      .trial-card {
        padding: 18px 16px;
      }

      .trial-middle {
        grid-template-rows: auto;
      }

      .trial-middle > * {
        width: 100%;
      }
    }
  </style>
</head>

<body class="page-canvas">
  <header class="site-header">
    <div class="header-inner page-header-inner site-container">
      <a class="brand" href="index.html">FRAGRANCE WORKSHOP</a>
      <div class="header-actions">
        <a class="btn btn-secondary" href="index.html">トップへ戻る</a>
        <a class="btn btn-primary" href="reservation.html">予約ページを見る</a>
      </div>
    </div>
  </header>

  <main class="trial-page">
    <section class="trial-shell" aria-labelledby="basic-info-title">
      <div class="trial-header">
        <span class="eyebrow">basic information</span>
        <h1 id="basic-info-title">基本情報</h1>
      </div>

      <div class="basic-info-layout">
        <figure class="trial-visual trial-left" aria-label="店頭看板イメージ">
          <img src="img/TOP/看板.png" alt="店頭の看板イメージ">
        </figure>

        <div class="trial-middle">
          <article class="trial-card">
            <h2>当店では予約なしでも、<br>お時間が空いていれば<br>ワークを体験できます。</h2>
            <ul class="trial-list">
              <li>事前予約があるとよりあなた好みに</li>
              <li>店内での販売も行っています</li>
            </ul>
          </article>

          <figure class="trial-visual trial-subvisual" aria-label="料金関連イメージ">
            <img src="img/TOP/香水ハンドクリーム.png" alt="香水ハンドクリームのイメージ">
          </figure>

          <div class="trial-price-wrap">
            <img class="trial-price" src="img/TOP/値段表.png" alt="料金表">
            <div class="trial-price-actions">
              <a class="btn btn-secondary" href="questionnaire.html">診断</a>
              <a class="btn btn-primary" href="reservation.html">予約</a>
            </div>
          </div>
        </div>

        <div class="trial-right">
          <figure class="trial-visual trial-station" aria-label="所在地イメージ">
            <img src="img/TOP/上野駅.png" alt="上野駅周辺イメージ">
          </figure>

          <section class="trial-map" aria-labelledby="trial-map-title">
            <div class="trial-map-head">
              <strong id="trial-map-title">グーグルマップ</strong>
              <p>東京都台東区東上野3-15-5 曽我ビル3F</p>
            </div>
            <iframe
              title="東京都台東区東上野3-15-5 曽我ビル3F の地図"
              loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"
              src="https://www.google.com/maps?q=%E6%9D%B1%E4%BA%AC%E9%83%BD%E5%8F%B0%E6%9D%B1%E5%8C%BA%E6%9D%B1%E4%B8%8A%E9%87%8E3-15-5%20%E6%9B%BD%E6%88%91%E3%83%93%E3%83%AB3F&z=17&output=embed"></iframe>
          </section>
        </div>
      </div>
    </section>
  </main>
</body>

</html>
