<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>店舗スタッフログイン | Fregrance</title>
  <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="admin-body">
  <main class="login-shell">
    <section class="login-card">
      <p class="eyebrow">Store Staff</p>
      <h1>予約管理ログイン</h1>
      <p class="muted">店舗スタッフ用の管理画面です。ログイン後に予約一覧とアンケート内容を確認できます。</p>

      <div class="alert success" th:if="${param.logout}">
        ログアウトしました。
      </div>
      <div class="alert error" th:if="${param.error}">
        ユーザー名またはパスワードが正しくありません。
      </div>

      <form th:action="@{/login}" method="post" class="login-form">
        <label class="field">
          <span>ユーザー名</span>
          <input type="text" name="username" autocomplete="username" required>
        </label>
        <label class="field">
          <span>パスワード</span>
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button type="submit" class="primary-button">ログインする</button>
      </form>
    </section>
  </main>
</body>
</html>
